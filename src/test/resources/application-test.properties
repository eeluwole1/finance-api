spring.application.name=finance-api

# In-memory H2 database so the test suite (and CI) never needs real DB
# credentials — PostgreSQL compatibility mode keeps data.sql portable.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

jwt.secret=fqvSgxXruQ2N+1tqTn5+6gHZ32f9TfCW5AkcRfrZF3o=
jwt.expiration=3600000
spring.jpa.open-in-view=false

cors.allowed-origins=http://localhost:4200,http://localhost:3000
