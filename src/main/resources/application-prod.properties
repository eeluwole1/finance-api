# Activated via SPRING_PROFILES_ACTIVE=prod.
#
# ddl-auto stays "update" (not "validate") because this project has no
# migration tool (Flyway/Liquibase) to create the schema ahead of time —
# switching to "validate" would just fail the first deploy against an
# empty database. If this ever handles real user data, add a migration
# tool and switch to "validate" then. Seed data stays on: this is a demo
# deployment, and data.sql's WHERE NOT EXISTS guards make it safe to
# re-run on every restart without duplicating rows.

spring.jpa.show-sql=false

# No default here — must be set explicitly via the ALLOWED_ORIGINS env var
# to the deployed frontend's origin(s).
cors.allowed-origins=${ALLOWED_ORIGINS}
